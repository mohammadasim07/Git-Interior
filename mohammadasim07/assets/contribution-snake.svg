<svg fill="none" viewBox="0 0 820 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0b0f19; stroke: #1e293b; stroke-width: 1; rx: 12; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .stat-text { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 600; fill: #38bdf8; }
      .grid-dot { rx: 2.5; width: 10px; height: 10px; }
      .c0 { fill: #161b22; }
      .c1 { fill: #0e4429; }
      .c2 { fill: #006d32; }
      .c3 { fill: #26a641; }
      .c4 { fill: #39d353; }
      
      /* Animated Snake Movement */
      @keyframes moveSnakeHead {
        0%   { transform: translate(120px, 60px); }
        20%  { transform: translate(320px, 60px); }
        35%  { transform: translate(320px, 100px); }
        55%  { transform: translate(560px, 100px); }
        70%  { transform: translate(560px, 130px); }
        85%  { transform: translate(750px, 130px); }
        92%  { transform: translate(750px, 60px); }
        100% { transform: translate(120px, 60px); }
      }
      @keyframes moveSnakeBody1 {
        0%   { transform: translate(105px, 60px); }
        20%  { transform: translate(305px, 60px); }
        35%  { transform: translate(320px, 85px); }
        55%  { transform: translate(545px, 100px); }
        70%  { transform: translate(560px, 115px); }
        85%  { transform: translate(735px, 130px); }
        92%  { transform: translate(750px, 75px); }
        100% { transform: translate(105px, 60px); }
      }
      @keyframes moveSnakeBody2 {
        0%   { transform: translate(90px, 60px); }
        20%  { transform: translate(290px, 60px); }
        35%  { transform: translate(320px, 70px); }
        55%  { transform: translate(530px, 100px); }
        70%  { transform: translate(560px, 100px); }
        85%  { transform: translate(720px, 130px); }
        92%  { transform: translate(750px, 90px); }
        100% { transform: translate(90px, 60px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #38bdf8); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #39d353); }
      }
      .snake-head {
        fill: #38bdf8;
        animation: moveSnakeHead 12s cubic-bezier(0.4, 0, 0.2, 1) infinite, pulseGlow 2s infinite;
        rx: 3.5;
        width: 12px;
        height: 12px;
      }
      .snake-b1 {
        fill: #34d399;
        animation: moveSnakeBody1 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        rx: 3;
        width: 11px;
        height: 11px;
      }
      .snake-b2 {
        fill: #10b981;
        animation: moveSnakeBody2 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        rx: 2.5;
        width: 10px;
        height: 10px;
      }
    </style>
  </defs>

  <!-- Container Box -->
