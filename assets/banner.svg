<svg fill="none" viewBox="0 0 800 210" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background container -->
  <rect width="800" height="210" rx="16" fill="url(#bg-grad)" stroke="#374151" stroke-width="1.2" />
  <circle cx="680" cy="50" r="140" fill="url(#glow)" />

  <!-- Accent top bar -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Badge Pill -->
  <rect x="40" y="28" width="280" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
  <text x="52" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="0.4">
    🚀 FULL-STACK &amp; BACKEND ENGINEER
  </text>

  <!-- Greeting Title -->
  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
    Hi, I'm <tspan fill="url(#text-grad)">Mohammad Asim</tspan> 👋
  </text>

  <!-- Subtitle -->
  <text x="40" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    Crafting resilient distributed systems, Spring Boot 3.4 microservices &amp; Agentic AI workflows
  </text>

  <!-- Highlights Pills -->
  <!-- Pill 1: Java & Spring Boot -->
  <g transform="translate(40, 148)">
    <rect width="180" height="30" rx="7" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="19" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#38bdf8">⚡ Java 21 / Spring 3.4</text>
  </g>

  <!-- Pill 2: Agentic AI -->
  <g transform="translate(230, 148)">
    <rect width="170" height="30" rx="7" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="19" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#a78bfa">🤖 Agentic AI &amp; Next.js</text>
  </g>

  <!-- Pill 3: Hackathon Winner -->
  <g transform="translate(410, 148)">
    <rect width="165" height="30" rx="7" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="19" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#fbbf24">🏆 Hackathon Winner</text>
  </g>

  <!-- Pill 4: LPU B.Tech -->
  <g transform="translate(585, 148)">
    <rect width="170" height="30" rx="7" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="19" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600" fill="#34d399">🎓 LPU B.Tech CSE</text>
  </g>
</svg>
